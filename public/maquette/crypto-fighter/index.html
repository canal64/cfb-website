html,body{height:100%;background:#000;color:#fff;overflow:hidden;font-family:"Press Start 2P",monospace;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

body.touch #pad{display:flex}
.grp{display:grid;gap:10px;pointer-events:auto}
.dir{grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,52px)}
.act{grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,52px)}

.k.on{background:rgba(255,131,48,.55);border-color:var(--o1)}

let unl=false;function unlock(){if(unl)return;unl=true;try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 try{const a=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');a.setAttribute('playsinline','');a.play().catch(()=>{})}catch(e){}}
function ac(){if(muted)return null;unlock();if(!AC){const K=window.AudioContext||window.webkitAudioContext;if(!K)return null;AC=new K()}if(AC.state!=='running')AC.resume();return AC}
function noise(dur,f0,f1,vol,type='bandpass'){const a=ac();if(!a)return;const t=a.currentTime,b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.6);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type;
 f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(a.destination);s.start(t)}
function tone(fr,dur,vol,type='square',slide=1,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(fr,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,fr*slide),t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}

function txt(s,x,y,size,col='#fff',align='center',font='Press Start 2P',shadow=true){X.font=`${size}px "${font}"`;X.textAlign=align;X.textBaseline='middle';

 X.lineWidth=8;X.strokeStyle='#000';X.lineJoin='round';X.strokeText(s,x,y);X.fillStyle=g;X.fillText(s,x,y)}

function startAtk(f,type){if(f.state!=='idle'&&f.state!=='walk')return;f.state=type;f.t=0;f.hitDone=false;SFX.whoosh()}
function pose(f){/* joint angles in radians, 0 = pointing down, positive = toward the opponent */
 const t=f.t,bob=Math.sin(perf*.008)*.06;
 const P={lean:0,sh:[.7+bob,.45+bob],el:[1.7,1.8],hip:[.25,-.2],kn:[-.35,-.3],crouch:0};
 const ph=(a)=>t<a.act[0]?t/a.act[0]:t<a.act[1]?1:Math.max(0,1-(t-a.act[1])/(a.dur-a.act[1]));
 switch(f.state){
  case'walk':{const w=Math.sin(perf*.018);P.hip=[.1+w*.45,.1-w*.45];P.kn=[-.15-Math.max(0,-w)*.7,-.15-Math.max(0,w)*.7];break}
  case'punch':{const k=ph(ATK.punch);P.sh=[.7+.9*k,.45];P.el=[1.7-1.7*k,1.8];P.lean=.12*k;break}
  case'kick':{const k=ph(ATK.kick);P.hip=[.25+1.35*k,-.25];P.kn=[-.35+.35*k,-.4];P.lean=-.3*k;P.sh=[.3,-.2];P.el=[1.2,1.3];break}
  case'block':P.sh=[1.1,.9];P.el=[2.1,2.1];P.crouch=10;P.kn=[-.6,-.6];P.hip=[.5,.1];break;
  case'hurt':P.lean=-.35;P.sh=[-.5,-.7];P.el=[.4,.5];break;
  case'special':{const k=Math.min(1,t/220);P.sh=[.7+.9*k,.45+1.1*k];P.el=[1.7-1.7*k,1.8-1.8*k];P.lean=.1*k;P.crouch=8*k;break}
  case'jump':P.hip=[1.1,.5];P.kn=[-1.9,-1.7];P.sh=[1.4,.9];P.el=[1.3,1.4];break;
  case'win':{const w=Math.sin(perf*.01);P.sh=[3+w*.15,.5];P.el=[.2,1.8];break}
  case'ko':P.lean=-1.45;P.sh=[-2.2,-2.5];P.el=[0,0];P.hip=[.3,.5];P.kn=[0,0];break;
  case'frozen':P.lean=-.12;P.sh=[-.3,-.5];P.el=[.5,.4];break}
 return P}
function limb(x,y,a1,l1,a2,l2,w,col,dir){const x1=x+Math.sin(a1)*l1*dir,y1=y+Math.cos(a1)*l1,x2=x1+Math.sin(a1+a2)*l2*dir,y2=y1+Math.cos(a1+a2)*l2;
 X.strokeStyle=col;X.lineWidth=w;X.lineCap='round';X.lineJoin='round';X.beginPath();X.moveTo(x,y);X.lineTo(x1,y1);X.lineTo(x2,y2);X.stroke();return[x2,y2]}
function drawFighter(f){const P=pose(f),d=f.face,skin='#f2b48f',gi=f.gi,dark=shade(gi,-.35);
 X.save();X.translate(f.x,f.y);
 if(f.state==='ko'){X.translate(0,-6)}
 const hipY=-92+P.crouch,shY=hipY-62;X.rotate(P.lean*d);
 /* shadow */
 X.save();X.rotate(-P.lean*d);X.fillStyle='rgba(0,0,0,.35)';X.beginPath();X.ellipse(0,GROUND-f.y+4,46,9,0,0,7);X.restore();
 /* back arm + back leg */

 limb(-6*d,shY+6,P.sh[1],30,P.el[1],32,15,dark,d);
 /* torso */
 X.fillStyle=gi;X.beginPath();X.moveTo(-26,shY);X.lineTo(26,shY);X.lineTo(20,hipY+4);X.lineTo(-20,hipY+4);X.closePath();X.fill();
 X.fillStyle=skin;X.beginPath();X.moveTo(-8,shY);X.lineTo(8,shY);X.lineTo(0,shY+26);X.closePath();X.fill();
 X.fillStyle=f.belt;X.fillRect(-21,hipY-8,42,9);X.fillRect(8*d-3,hipY-2,6,16);
 /* front leg */
 const fl=limb(0,hipY,P.hip[0],48,P.kn[0],48,24,gi,d);
 X.fillStyle='#111';X.beginPath();X.ellipse(fl[0]+8*d,fl[1]+2,15,7,0,0,7);X.fill();
 /* head */
 const hx=6*d,hy=shY-40,hs=f.big?104:96;
 drawImg(f.head,hx,hy,hs,hs,d<0);
 /* front arm */
 const fa=limb(10*d,shY+6,P.sh[0],30,P.el[0],32,16,gi,d);
 X.fillStyle=skin;X.beginPath();X.arc(fa[0],fa[1],9.5,0,7);X.fill();X.strokeStyle='rgba(0,0,0,.35)';X.lineWidth=2;X.stroke();
 if(f.frozen>0){X.globalAlpha=.55;X.fillStyle='#7fe7ff';X.fillRect(-48,shY-92,96,-shY+92+6);X.globalAlpha=1;X.strokeStyle='#e0fbff';X.lineWidth=3;X.strokeRect(-48,shY-92,96,-shY+92+6)}
 X.restore()}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.round(r*(1+p));g=Math.round(g*(1+p));b=Math.round(b*(1+p));return`rgb(${Math.max(0,Math.min(255,r))},${Math.max(0,Math.min(255,g))},${Math.max(0,Math.min(255,b))})`}

function damage(att,def,dmg,kb,sfx,label){
 if(def.state==='ko')return;
 const blocking=def.state==='block';
 if(blocking){dmg=Math.ceil(dmg*.18);kb*=.5;SFX.block();spark((att.x+def.x)/2,def.y-120,'#e5e7eb',6)}
 else{SFX[sfx]();spark((att.x+def.x)/2,def.y-120,'#ffd46b',14);fx.shake=sfx==='heavy'?14:8;def.state='hurt';def.t=0;att.meter=Math.min(100,att.meter+12);att.combo++;if(att.combo>=3&&att.player){floatT(`${att.combo} HIT COMBO`,att.x,att.y-205,'#ffd46b')}}
 def.combo=0;def.hp=Math.max(0,def.hp-dmg);def.vx=kb*Math.sign(def.x-att.x);def.meter=Math.min(100,def.meter+6);
 if(def.player)stats.dmgTaken+=dmg;

function updateFighter(f,o,dt){
 f.t+=dt;if(f.frozen>0){f.frozen-=dt;if(f.frozen<=0){f.state='idle'};f.vx*=.8;return}
 if(f.state!=='ko'&&f.state!=='win')f.face=o.x>f.x?1:-1;
 /* physics */
 f.x+=f.vx;f.vx*=.82;f.vy+=1.1;f.y+=f.vy;if(f.y>=GROUND){f.y=GROUND;f.vy=0;if(f.state==='jump'){f.state='idle'}}
 f.x=Math.max(60,Math.min(W-60,f.x));
 const minD=78;if(Math.abs(f.x-o.x)<minD&&f.y>GROUND-40&&o.y>GROUND-40&&o.state!=='ko'){const push=(minD-Math.abs(f.x-o.x))/2;f.x-=Math.sign(o.x-f.x||1)*push}
 /* attack resolution */
 const a=ATK[f.state];
 if(a){if(!f.hitDone&&f.t>=a.act[0]&&f.t<=a.act[1]){const dist=Math.abs(o.x-f.x),vert=Math.abs(o.y-f.y);if(dist<a.reach&&vert<90&&o.state!=='ko'){f.hitDone=true;damage(f,o,a.dmg,a.kb,a.sfx)}}
  if(f.t>=a.dur)f.state='idle'}
 if(f.state==='hurt'&&f.t>260)f.state='idle';
 if(f.state==='special'&&f.t>420)f.state='idle'}

function controlPlayer(f,o){
 if(['ko','win','hurt','special','punch','kick'].includes(f.state)||f.frozen>0){take('punch');take('kick');take('special');take('up');return}
 if(take('special')&&special(f,o))return;
 if(take('punch'))return startAtk(f,'punch');
 if(take('kick'))return startAtk(f,'kick');
 if(take('up')&&f.y>=GROUND){f.vy=-21;f.state='jump';SFX.jump();return}
 if(f.state==='jump')return;
 if(keys.block){f.state='block';return}else if(f.state==='block')f.state='idle';
 const sp=4.6;if(keys.left){f.vx=-sp;f.state='walk'}else if(keys.right){f.vx=sp;f.state='walk'}else if(f.state==='walk')f.state='idle'}

function controlAI(f,o,dt){
 if(['ko','win','hurt','special','punch','kick','jump'].includes(f.state)||f.frozen>0)return;
 f.aiT-=dt;const lv=f.lv,dist=Math.abs(o.x-f.x);
 /* react to player attacks */
 if((o.state==='punch'||o.state==='kick')&&dist<140&&Math.random()<.05+lv*.045){f.state='block';f.t=0;f.aiT=260;return}
 if(projectiles.some(p=>p.owner===o&&Math.abs(p.x-f.x)<220)&&Math.random()<.04+lv*.03){if(Math.random()<.5){f.vy=-21;f.state='jump'}else{f.state='block';f.aiT=400}return}
 if(f.aiT>0){if(f.state==='block')return;return}
 if(f.state==='block')f.state='idle';
 const aggr=.35+lv*.11;
 if(dist>130){if(f.meter>=50&&Math.random()<.18+lv*.04){special(f,o);f.aiT=500;return}
  f.vx=f.face*(2.6+lv*.45);f.state='walk';f.aiT=120+Math.random()*120;return}
 if(Math.random()<aggr){startAtk(f,Math.random()<.55?'punch':'kick');f.aiT=380+Math.random()*(600-lv*80)}
 else if(Math.random()<.4){f.vx=-f.face*3;f.state='walk';f.aiT=200}
 else{f.state='idle';f.aiT=150+Math.random()*250}}
